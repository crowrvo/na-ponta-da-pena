services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vms_finance}
      POSTGRES_USER: ${POSTGRES_USER:-vms_finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vms_finance_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vms_finance} -d ${POSTGRES_DB:-vms_finance}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vms_finance_postgres:

