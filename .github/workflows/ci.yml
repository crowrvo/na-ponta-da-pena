name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore VmsFinance.slnx
      - run: dotnet build VmsFinance.slnx --configuration Release --no-restore
      - run: dotnet test VmsFinance.slnx --configuration Release --no-build

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vms_finance_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

